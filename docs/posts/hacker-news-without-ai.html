  <body>
    <a href="/index.html">Back</a>
    <a href="https://hcker.news/?ai=exclude">Original</a>
    <h1>Show HN: Hacker News, without AI</h1>
    
    <div id="readability-page-1" class="page"><div id="search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-dialog-title" tabindex="-1">
          <h2 id="search-dialog-title">
            Search stories and comments
          </h2>
          
          <!-- Search Input Container (Initially Hidden) -->
          <div id="search-container">
            <div>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
              <p><span id="search-strict-label">Strict</span>
                <label data-tooltip="Match search terms exactly." data-tooltip-side="bottom">
                  
                  <span></span>
                </label>
              </p>
              </div>
          </div>
          <!-- Search Results Header (Inside Overlay) -->
          <div id="search-overlay">
            <div id="search-results-header">
              
              <div id="search-controls">
                <div>
                  <p><span id="search-type-label">Type</span></p>
                </div>
                <div id="search-match-fields">
                  <p><span id="search-match-label">Match in</span></p><p><label>
                      
                      <span>Title</span>
                    </label>
                    <label>
                      
                      <span>URL</span>
                    </label>
                    <label>
                      
                      <span>Text</span>
                    </label>
                    <label>
                      
                      <span>Author</span>
                    </label>
                  </p>
                  <p><label>
                      
                      <span>Author</span>
                    </label>
                    <label>
                      
                      <span>Text</span>
                    </label>
                  </p>
                </div>
                <div>
                  <p><span id="search-sort-label">Sort</span></p>
                </div>
                <div>
                  <p><span id="search-time-label">Time</span></p>
                </div>
              </div>
            </div>
            <div id="search-empty-state">
              <div>
                
                <div>
                  <section>
                    <span>Try a query</span>
                    
                  </section>
                  <section>
                    <span>Jump to</span>
                    
                  </section>
                </div>
              </div>
            </div>
            
            <p>Searching…</p>
          </div>
        </div></div>
