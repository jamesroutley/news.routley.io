    <h1>Parser Combinators</h1>
    
    <div id="readability-page-1" class="page"><div data-viz-phase="intro" data-viz-active="false" inert="" data-astro-cid-5cgxuhsa=""><figure data-astro-cid-ylpovjij=""><p><code data-astro-cid-ylpovjij="">&#34;<span data-astro-cid-ylpovjij="">Hello</span>, <span data-astro-cid-ylpovjij="">world</span>!&#34;</code><span aria-hidden="true" data-astro-cid-ylpovjij="">→</span><code data-astro-cid-ylpovjij="">{
  greeting: <span data-astro-cid-ylpovjij="">&#34;Hello&#34;</span>,
  who: <span data-astro-cid-ylpovjij="">&#34;world&#34;</span>
}</code></p><figcaption data-astro-cid-ylpovjij="">The string &#34;Hello, world!&#34; parses into an object with greeting &#34;Hello&#34;, who &#34;world&#34;.</figcaption></figure></div><div data-viz-phase="type" data-viz-active="false" inert="" data-astro-cid-5cgxuhsa=""><figure data-parser-type="" data-cut="2" data-len="8" data-stage="seek" data-astro-cid-pzodn2xh=""><div data-astro-cid-pzodn2xh=""><p><code data-astro-cid-pzodn2xh=""><span data-astro-cid-pzodn2xh="">type</span> Parser&lt;<span data-astro-cid-pzodn2xh="">T</span>&gt; =<span data-astro-cid-pzodn2xh=""></span> <span data-astro-cid-pzodn2xh="">(input: string) =&gt; [<span data-astro-cid-pzodn2xh="">T</span>, <span data-astro-cid-pzodn2xh="">string</span>]</span></code></p><p><code data-astro-cid-pzodn2xh=""><span data-astro-cid-pzodn2xh="">[</span><span data-astro-cid-pzodn2xh="">&#34;</span><span data-astro-cid-pzodn2xh=""><span data-astro-cid-pzodn2xh="">pInteger</span><span data-astro-cid-pzodn2xh="">number</span>10</span><span data-astro-cid-pzodn2xh="">, <span data-astro-cid-pzodn2xh="">&#34;</span></span><span data-astro-cid-pzodn2xh=""><span data-astro-cid-pzodn2xh="">string</span> 20 30</span><span data-astro-cid-pzodn2xh="">&#34;</span><span data-astro-cid-pzodn2xh="">]</span><span aria-hidden="true" data-astro-cid-pzodn2xh=""><span data-astro-cid-pzodn2xh="">pInteger</span></span></code></p></div><figcaption data-astro-cid-pzodn2xh="">The type Parser of T is a function from an input string to a pair of a T and the rest of the string. For example, pInteger cuts &#34;10 20 30&#34; after&#34;10&#34;, and returns the number 10 and the rest of the string,&#34; 20 30&#34;.</figcaption></figure></div><div data-viz-phase="chain" data-viz-active="false" inert="" data-astro-cid-5cgxuhsa=""><figure data-parser-chain="" data-hold-ms="5000" data-astro-cid-rvhuomkz=""><div data-plate="" data-astro-cid-rvhuomkz=""><p><code data-astro-cid-rvhuomkz="">pHello</code><code data-astro-cid-rvhuomkz="" data-strip=""><span data-astro-cid-rvhuomkz="">[</span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">Hello</span></span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz="">, </span><span data-rest="" data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz=""> 100</span><span data-astro-cid-rvhuomkz="">&#34;</span></span><span data-astro-cid-rvhuomkz="">]</span><span aria-hidden="true" data-astro-cid-rvhuomkz=""></span></code></p><p><code data-astro-cid-rvhuomkz="">pIgnoreWhitespace</code><code data-astro-cid-rvhuomkz="" data-strip=""><span data-astro-cid-rvhuomkz="">[</span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz=""> </span><span data-astro-cid-rvhuomkz="">null</span></span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz="">, </span><span data-rest="" data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz="">100</span><span data-astro-cid-rvhuomkz="">&#34;</span></span><span data-astro-cid-rvhuomkz="">]</span><span aria-hidden="true" data-astro-cid-rvhuomkz=""></span></code></p><p><code data-astro-cid-rvhuomkz="">pInteger</code><code data-astro-cid-rvhuomkz="" data-strip=""><span data-astro-cid-rvhuomkz="">[</span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">100</span></span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz="">, </span><span data-rest="" data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz=""></span><span data-astro-cid-rvhuomkz="">&#34;</span></span><span data-astro-cid-rvhuomkz="">]</span><span aria-hidden="true" data-astro-cid-rvhuomkz=""></span></code></p></div><figcaption data-astro-cid-rvhuomkz="">&#34;Hello 100&#34; parsed by pHello, then pIgnoreWhitespace, then pInteger, each taking the rest the one before left over: pHello returns &#34;Hello&#34; and &#34; 100&#34;. pIgnoreWhitespace returns &#34; &#34; and &#34;100&#34;. pInteger returns &#34;100&#34; and &#34;&#34;.</figcaption></figure></div><div data-viz-phase="chain-one" data-viz-active="false" inert="" data-astro-cid-5cgxuhsa=""><figure data-parser-chain="" data-hold-ms="5000" data-astro-cid-rvhuomkz=""><div data-plate="" data-astro-cid-rvhuomkz=""><p><code data-astro-cid-rvhuomkz="">pHello100</code><code data-astro-cid-rvhuomkz="" data-strip=""><span data-astro-cid-rvhuomkz="">[</span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">Hello 100</span><span data-astro-cid-rvhuomkz="">[&#34;Hello&#34;, null, 100]</span></span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz="">, </span><span data-rest="" data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz=""></span><span data-astro-cid-rvhuomkz="">&#34;</span></span><span data-astro-cid-rvhuomkz="">]</span><span aria-hidden="true" data-astro-cid-rvhuomkz=""></span></code></p></div><figcaption data-astro-cid-rvhuomkz="">&#34;Hello 100&#34; parsed by pHello100, each taking the rest the one before left over: pHello100 returns &#34;Hello 100&#34; and &#34;&#34;.</figcaption></figure></div><div data-viz-phase="seq-type" data-viz-active="false" inert="" data-astro-cid-5cgxuhsa=""><div data-astro-cid-xrb3j3tt=""><figure data-astro-cid-tvpxczng=""><p><code data-astro-cid-tvpxczng="">pSeq(
  <span data-astro-cid-tvpxczng="">pHello</span>,
  <span data-astro-cid-tvpxczng="">pIgnoreWhitespace</span>,
  <span data-astro-cid-tvpxczng="">pInteger</span>
)</code><span aria-hidden="true" data-astro-cid-tvpxczng="">⇒</span><code data-astro-cid-tvpxczng=""><span data-astro-cid-tvpxczng="">Parser&lt;[</span>
  <span data-astro-cid-tvpxczng="">string</span><span data-astro-cid-tvpxczng="">,</span>
  <span data-astro-cid-tvpxczng="">null</span><span data-astro-cid-tvpxczng="">,</span>
  <span data-astro-cid-tvpxczng="">number</span>
<span data-astro-cid-tvpxczng="">]&gt;</span></code></p><figcaption data-astro-cid-tvpxczng="">pSeq given pHello, pIgnoreWhitespace, pInteger is a Parser of the tuple [string, null, number].</figcaption></figure><hr/><p><code>const pHello100 = pSeq(...)</code><code>const result = pHello100(&#34;Hello 100&#34;)</code></p><figure data-parser-chain="" data-hold-ms="5000" data-astro-cid-rvhuomkz=""><div data-plate="" data-astro-cid-rvhuomkz=""><p><code data-astro-cid-rvhuomkz="">pHello100</code><code data-astro-cid-rvhuomkz="" data-strip=""><span data-astro-cid-rvhuomkz="">[</span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">Hello 100</span><span data-astro-cid-rvhuomkz="">[&#34;Hello&#34;, null, 100]</span></span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz="">, </span><span data-rest="" data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz=""></span><span data-astro-cid-rvhuomkz="">&#34;</span></span><span data-astro-cid-rvhuomkz="">]</span><span aria-hidden="true" data-astro-cid-rvhuomkz=""></span></code></p></div><figcaption data-astro-cid-rvhuomkz="">&#34;Hello 100&#34; parsed by pHello100, each taking the rest the one before left over: pHello100 returns &#34;Hello 100&#34; and &#34;&#34;.</figcaption></figure></div></div><div data-viz-phase="map" data-viz-active="false" inert="" data-astro-cid-5cgxuhsa=""><figure data-parser-chain="" data-hold-ms="5000" data-astro-cid-rvhuomkz=""><div data-plate="" data-astro-cid-rvhuomkz=""><p><code data-astro-cid-rvhuomkz="">pGreeting</code><code data-astro-cid-rvhuomkz="" data-strip=""><span data-astro-cid-rvhuomkz="">[</span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">Hello 100</span><span data-astro-cid-rvhuomkz="">[&#34;Hello&#34;, null, 100]</span><span data-astro-cid-rvhuomkz="">{

}</span><span data-astro-cid-rvhuomkz="">pMap</span></span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz="">, </span><span data-rest="" data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz=""></span><span data-astro-cid-rvhuomkz="">&#34;</span></span><span data-astro-cid-rvhuomkz="">]</span><span aria-hidden="true" data-astro-cid-rvhuomkz=""></span></code></p></div><figcaption data-astro-cid-rvhuomkz="">&#34;Hello 100&#34; parsed by pGreeting, each taking the rest the one before left over: pGreeting returns &#34;Hello 100&#34; and &#34;&#34;.</figcaption></figure></div><div data-viz-phase="repeat" data-viz-active="false" inert="" data-astro-cid-5cgxuhsa=""><figure data-parser-chain="" data-hold-ms="5000" data-astro-cid-rvhuomkz=""><div data-plate="" data-astro-cid-rvhuomkz=""><p><code data-astro-cid-rvhuomkz="">pSeq(pNumber, pSemicolon)</code><code data-astro-cid-rvhuomkz="" data-strip=""><span data-astro-cid-rvhuomkz="">[</span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">10;</span><span data-astro-cid-rvhuomkz="">[10, &#34;;&#34;]</span></span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz="">, </span><span data-rest="" data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz="">20;30;</span><span data-astro-cid-rvhuomkz="">&#34;</span></span><span data-astro-cid-rvhuomkz="">]</span><span aria-hidden="true" data-astro-cid-rvhuomkz=""></span></code></p><p><code data-astro-cid-rvhuomkz="">pSeq(pNumber, pSemicolon)</code><code data-astro-cid-rvhuomkz="" data-strip=""><span data-astro-cid-rvhuomkz="">[</span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-rvhuomkz=""><span data-astro-cid-rvhuomkz="">20;</span><span data-astro-cid-rvhuomkz="">[20, &#34;;&#34;]</span></span><span data-astro-cid-rvhuomkz="">&#34;</span><span data-astro-cid-
